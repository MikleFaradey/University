services:
  bank:
    build: .
    ports:
      - "127.0.0.1:9999:9999"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    volumes:
      - bank-data:/app/data
      - ./secrets:/app/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  bank-data:
