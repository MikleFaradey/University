name: bank-tasks

services:
  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    env_file: .env
    ports:
      - "${NOTIFICATION_PORT}:${NOTIFICATION_PORT}"
    networks: [bank_net]
    volumes:
      - notification_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['NOTIFICATION_PORT']+'/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    env_file: .env
    ports:
      - "${AUDIT_PORT}:${AUDIT_PORT}"
    networks: [bank_net]
    volumes:
      - audit_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['AUDIT_PORT']+'/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  task:
    build:
      context: .
      dockerfile: services/task/Dockerfile
    env_file: .env
    ports:
      - "${TASK_PORT}:${TASK_PORT}"
    networks: [bank_net]
    volumes:
      - task_data:/data
    depends_on:
      notification:
        condition: service_healthy
      audit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ['TASK_PORT']+'/health', timeout=2)\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

networks:
  bank_net:
    driver: bridge

volumes:
  task_data:
  notification_data:
  audit_data:
