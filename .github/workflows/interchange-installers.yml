name: Build native Interchange installers

on:
  pull_request:
    paths:
      - "Diplom/interchange_v6_3_16_final_stable/**"
      - ".github/workflows/interchange-installers.yml"
  push:
    paths:
      - "Diplom/interchange_v6_3_16_final_stable/**"
      - ".github/workflows/interchange-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test requirements
        working-directory: Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable
        run: |
          python -m pip install -r server/requirements.txt PySide6
      - name: Run regression tests
        working-directory: Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke_regressions.py

  linux-deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build client, server and admin Debian packages
        working-directory: Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable
        run: |
          bash installer/linux/client/build_client_deb.sh
          bash installer/linux/server/build_server_deb.sh
          bash installer/linux/admin/build_admin_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Interchange-Linux-deb
          path: |
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/linux/client/output/*.deb
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/linux/server/output/*.deb
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/linux/admin/output/*.deb
          if-no-files-found: error

  macos-pkg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build client, server and admin packages
        shell: bash
        working-directory: Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable
        run: |
          python3 -m venv .venv-client-build
          source .venv-client-build/bin/activate
          python -m pip install pyinstaller requests PySide6
          bash installer/macos/client/build_client_pkg.command
          bash installer/macos/server/build_server_pkg.command
          bash installer/macos/admin/build_admin_pkg.command
      - uses: actions/upload-artifact@v4
        with:
          name: Interchange-macOS-pkg
          path: |
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/macos/client/output/*.pkg
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/macos/server/output/*.pkg
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/macos/admin/output/*.pkg
          if-no-files-found: error

  windows-exe:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress
          }
      - name: Build client, server and admin installers
        shell: cmd
        working-directory: Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable
        run: |
          call installer\windows\client\build_client_installer.bat
          if errorlevel 1 exit /b 1
          call installer\windows\server\build_server_installer.bat
          if errorlevel 1 exit /b 1
          call installer\windows\admin\build_admin_installer.bat
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: Interchange-Windows-exe
          path: |
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/windows/client/output/*.exe
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/windows/server/output/*.exe
            Diplom/interchange_v6_3_16_final_stable/interchange_v6_3_16_final_stable/installer/windows/admin/output/*.exe
          if-no-files-found: error
