name: Bank Tasks DZ6
on:
  push:
    branches: [master]
    paths:
      - 'Python/Homework_6/**'
      - '.github/workflows/bank-tasks-dz6.yml'
  pull_request:
    paths:
      - 'Python/Homework_6/**'
      - '.github/workflows/bank-tasks-dz6.yml'
  workflow_dispatch:

jobs:
  tests-and-compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Python/Homework_6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Automated API tests
        run: python -m pytest -v
      - name: Prepare environment
        run: cp .env.example .env
      - name: Compose build and healthchecks
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 150
          docker compose ps
      - name: HTTP smoke test
        run: |
          python - <<'PY'
          import json, urllib.request
          for port in (8001, 8002, 8003):
              with urllib.request.urlopen(f'http://localhost:{port}/health', timeout=5) as resp:
                  assert json.load(resp)['status'] == 'ok'
          url='http://localhost:8001/auth/login-json'
          payload=json.dumps({'login':'admin','password':'change-this-password'}).encode()
          req=urllib.request.Request(url,payload,{'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req, timeout=5) as resp:
              assert json.load(resp)['token_type']=='bearer'
          PY
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Stop containers
        if: always()
        run: docker compose down
